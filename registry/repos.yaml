# Xerago Intelligence Engine — Repository Registry
# Documentation: docs/repository_tracking_strategy.md
# Schema: registry/schemas/repos.schema.json
#
# Lifecycle monitoring: surface only on new version / milestone — never on trending or commits.

version: repos_v1.0.0
schema: registry/schemas/repos.schema.json

metadata:
  updated_at: "2026-05-29"
  description: Curated GitHub repositories for OSS lifecycle signal detection
  documentation: docs/repository_tracking_strategy.md

tier_definitions:
  A:
    priority: P0
    poll_cadence: PT1H
    description: Strategic — Xerago delivery stacks, agents, enterprise AI runtimes
    semver_policy:
      major: promote
      minor: promote
      patch: promote_if_keywords
      non_semver: hold
      patch_keywords: [security, breaking, CVE, deprecated, BREAKING CHANGE]
      milestone_keywords: [GA, LTS, security, breaking]
  B:
    priority: P1
    poll_cadence: PT4H
    description: Ecosystem — important libraries and evaluation tooling
    semver_policy:
      major: promote
      minor: promote_if_keywords
      patch: promote_if_keywords
      non_semver: hold
      minor_keywords: [breaking, API, deprecated, security, BREAKING CHANGE]
      patch_keywords: [security, CVE, breaking]
      milestone_keywords: [GA, security]
  C:
    priority: P2
    poll_cadence: PT12H
    description: Watch — situational awareness; strict promotion bar
    semver_policy:
      major: promote
      minor: hold
      patch: promote_if_keywords
      non_semver: hold
      patch_keywords: [security, CVE]
      milestone_keywords: [security]

