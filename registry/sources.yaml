# Xerago Intelligence Engine — Source Registry
# Documentation: docs/sources.md
# Schema: registry/schemas/sources.schema.json

version: sources_v1.0.0
schema: registry/schemas/sources.schema.json

metadata:
  updated_at: "2026-05-29"
  description: Authoritative registry of ingestion sources for the Enterprise Technology Radar
  documentation: docs/sources.md

taxonomy:
  priorities:
    - id: P0
      label: Partner ecosystem
      ingest_sla_hours: 2
    - id: P1
      label: AI vendors
      ingest_sla_hours: 4
    - id: P2
      label: Open source (curated repos)
      ingest_sla_hours: 4
      registry: registry/repos.yaml
    - id: P3
      label: Research
      ingest_sla_hours: 24
    - id: P4
      label: Industry intelligence
      ingest_sla_hours: 4
  source_types:
    - blog
    - docs
    - github
    - rss
    - api
    - newsletter
    - press
    - changelog
    - community
    - sitemap
  trust_tiers:
    - id: T1
      label: Primary — official entity channels
      can_originate_strategic_signal: true
    - id: T2
      label: Curated third-party
      can_originate_strategic_signal: true
    - id: T3
      label: Secondary — corroboration only
      can_originate_strategic_signal: false
  ingestion_methods:
    - pull_rss
    - pull_api
    - github_releases
    - github_org_releases
    - sitemap
    - scrape
    - email_parse
    - manual
    - webhook

